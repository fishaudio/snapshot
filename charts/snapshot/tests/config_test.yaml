suite: snapshot agent configuration validation
templates:
  - templates/configmap.yaml
tests:
  - it: configures always-on PageBroker without a helper or capture-format setting
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'restoreMode: "direct"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'controlSocketPath: "/pagebroker/control/pagebroker.sock"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "cudaCheckpoint|enableChecksumDigest|transferBufferCount|storageMode"

  - it: renders both the new and the pre-rename timeout keys
    set:
      config.checkpoint.timeoutSeconds: 1200
      config.restore.timeoutSeconds: 2400
    asserts:
      # A v0.2.0 agent that restarts before the DaemonSet roll reaches its node
      # reads this ConfigMap and dies at validation without the old restore key.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'timeoutSeconds: 1200\n  checkpointTimeoutSeconds: 1200'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'timeoutSeconds: 2400\n  restoreTimeoutSeconds: 2400'

  - it: refuses a value still set under a pre-rename timeout key
    set:
      config.checkpoint.checkpointTimeoutSeconds: 7200
    asserts:
      # Helm drops an unknown value silently, so without this the operator would
      # believe they raised the timeout while the agent ran on the default.
      - failedTemplate:
          errorPattern: "config.checkpoint.checkpointTimeoutSeconds was renamed"

  - it: refuses a value still set under the pre-rename restore timeout key
    set:
      config.restore.restoreTimeoutSeconds: 9000
    asserts:
      - failedTemplate:
          errorPattern: "config.restore.restoreTimeoutSeconds was renamed"

  - it: rejects a caller-selected checkpoint mount path
    set:
      storage.pvc.basePath: /other
    asserts:
      - failedTemplate:
          errorPattern: "storage.pvc.basePath is fixed at /checkpoints"

  - it: keeps the restore compatibility gate on by default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "skipCompatCheck: false"

  - it: renders the node-wide compatibility gate opt-out
    set:
      config.restore.skipCompatCheck: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "skipCompatCheck: true"

  - it: configures direct restore independently of CRIU I/O
    set:
      pageBroker.restoreMode: direct
      config.criu.imageIoMode: writeback
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'restoreMode: "direct"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'imageIoMode: "writeback"'

  - it: allows opting into staged restore
    set:
      pageBroker.restoreMode: staged
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'restoreMode: "staged"'

  - it: leaves memory page compression off and restore decoding serial by default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'compress: false\n  compressBlockBytes: 0\n  decompressThreads: 1\n'

  - it: renders memory page compression and the restore workers
    set:
      config.criu.compress: true
      config.criu.compressBlockBytes: 1048576
      config.criu.decompressThreads: 8
    asserts:
      # A large integer must not render in exponent form.
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'compress: true\n  compressBlockBytes: 1048576\n  decompressThreads: 8\n'

  - it: lets CRIU choose the restore workers
    set:
      config.criu.decompressThreads: 0
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'decompressThreads: 0\n'

  - it: rejects more restore workers than CRIU accepts
    set:
      config.criu.decompressThreads: 1025
    asserts:
      - failedTemplate:
          errorPattern: "decompressThreads"

  - it: rejects a compression block size that is not a whole number of bytes
    set:
      config.criu.compressBlockBytes: 1.5
    asserts:
      - failedTemplate:
          errorPattern: "compressBlockBytes"
